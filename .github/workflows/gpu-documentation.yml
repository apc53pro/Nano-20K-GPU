name: GPU documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require both guides alongside architecture or control changes
        env:
          GPU_DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GPU_DOCS_HEAD: ${{ github.sha }}
          GPU_DOCS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$GPU_DOCS_BASE" || "$GPU_DOCS_BASE" =~ ^0+$ ]]; then
            # A new branch can contain several commits: inspect its entire
            # divergence from the default branch, not only the final commit.
            GPU_DOCS_DEFAULT_REF="refs/remotes/origin/$GPU_DOCS_DEFAULT_BRANCH"
            git rev-parse --verify "$GPU_DOCS_DEFAULT_REF^{commit}" >/dev/null
            GPU_DOCS_BASE="$(git merge-base "$GPU_DOCS_HEAD" "$GPU_DOCS_DEFAULT_REF")"
          fi
          python3 scripts/check-gpu-docs.py --base "$GPU_DOCS_BASE" --head "$GPU_DOCS_HEAD"
      - name: Check the documentation guard itself
        run: python3 -B -m unittest discover -s scripts/tests -p test_gpu_docs.py
      - name: Compile and exercise the generic CPU control examples
        run: make -j4 gpu-docs-test
