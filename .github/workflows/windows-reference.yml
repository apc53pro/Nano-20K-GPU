name: Windows reference renderer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ucrt64:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
      - name: Install dependencies and check RGB565 presentation
        run: ./scripts/setup-sdl2.sh
      - name: Reuse installed dependencies without invoking a package manager
        run: |
          pacman() { echo 'Unexpected package-manager invocation' >&2; return 99; }
          export -f pacman
          ./scripts/setup-sdl2.sh
          ./scripts/setup-sdl2.sh --check
      - name: Build SDL and headless applications and run conformance tests
        run: make -j4 all headless test
      - name: Verify all demo traversals
        run: |
          for scene in showcase perspective overdraw; do
            ./build/nano-gpu-ref-headless.exe --headless --scene "$scene" --time 1.25 --verify
          done
      - name: Exercise the SDL application
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./build/nano-gpu-ref.exe --frames 2 --step 0 --verify
      - name: Verify the Gowin block backend on the original scenes
        run: |
          ./build/nano-gpu-ref-headless.exe --hardware-profile
          for scene in showcase perspective overdraw opaque; do
            ./build/nano-gpu-ref-headless.exe --headless --scene "$scene" --mode blocks --time 1.25 --verify
          done
          SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./build/nano-gpu-ref.exe --scene showcase --mode blocks --frames 2 --step 0 --verify
      - name: Check incremental builds
        # The phony dependency check runs on every ordinary build.
        run: make -q -o check-sdl all headless build/reference-tests.exe build/hardware-tests.exe build/full-hardware-tests.exe build/sdram-tests.exe build/host_link-tests.exe build/scanout-tests.exe build/protocol-tests.exe build/system_copy-tests.exe build/system-tests.exe
      - name: Verify the timed GPU system and actual SDL scanout
        run: |
          ./build/nano-gpu-ref-headless.exe --mode system --hardware-profile
          ./build/nano-gpu-ref-headless.exe --headless --mode system --scene showcase --frames 2 --time 0 --verify
          ./build/nano-gpu-ref-headless.exe --headless --mode system --scene perspective --time 1.25 --host-divider 8 --sdram-trcd 6 --sdram-trp 6 --sdram-trfc 18 --scanout-fifo 256 --verify
          SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./build/nano-gpu-ref.exe --mode system --scene showcase --frames 1 --step 0 --verify
