name: Windows reference renderer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-ucrt64:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
      - name: Install native RTL dependencies and compile a Verilator/SDL smoke test
        run: ./scripts/setup-rtl-sim.sh
      - name: Verify dependency reuse
        run: ./scripts/setup-rtl-sim.sh --check
      - name: Build the native RTL simulator with SDL2
        run: python -u scripts/gpu-rtl.py --require-sdl --verbose
      - name: Verify the actual RTL scanout through SDL2
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./build/nano-gpu-rtl.exe --scene showcase --frames 2 --verify --scanout-log build/rtl-gpu/windows-scanout.csv
      - name: Verify native command and recovery handling
        run: ./build/nano-gpu-rtl.exe --self-test
      - name: Package the Windows simulator and runtime libraries
        run: |
          mkdir -p build/windows-rtl
          cp build/nano-gpu-rtl.exe build/windows-rtl/
          cp /ucrt64/bin/SDL2.dll /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libwinpthread-1.dll build/windows-rtl/
          printf '%s\n' 'Extract all files into one folder and run nano-gpu-rtl.exe.' 'This is a cycle-by-cycle simulator; expect slow playback.' 'Use --headless --frames 1 --verify for a headless comparison.' > build/windows-rtl/README.txt
      - name: Check the package without MSYS2 on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $program = (Resolve-Path .\build\windows-rtl\nano-gpu-rtl.exe).Path
          $process = Start-Process -FilePath $program -ArgumentList '--help' -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone simulator failed with exit code $($process.ExitCode)" }
      - name: Save the runnable Windows simulator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nano-gpu-rtl-windows
          path: build/windows-rtl/
      - name: Save native build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-rtl-simulator
          path: |
            build/rtl-gpu/build-report.json
            build/rtl-gpu/*.log
            build/rtl-gpu/*scanout.csv
            build/rtl-gpu/toolcheck/*.log
          if-no-files-found: warn

  ucrt64:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
      - name: Install dependencies and check RGB565 presentation
        run: ./scripts/setup-sdl2.sh
      - name: Reuse installed dependencies without invoking a package manager
        run: |
          pacman() { echo 'Unexpected package-manager invocation' >&2; return 99; }
          export -f pacman
          ./scripts/setup-sdl2.sh
          ./scripts/setup-sdl2.sh --check
      - name: Build SDL and headless applications and run conformance tests
        run: make -j4 all headless test throughput
      - name: Compile and exercise the generic C99 GPU control examples
        run: make gpu-docs-test
      - name: Verify fragment throughput traces and reports
        run: |
          ./build/throughput-bench.exe --output build/throughput/baseline.json
          ./build/throughput-bench.exe --workload flat --trace build/throughput/flat.csv --output build/throughput/flat.json
          ./build/throughput-bench.exe --workload textured --stalls --output build/throughput/textured-stalls.json
          ./build/throughput-bench.exe --workload textured-hit --trace build/throughput/textured-hit.csv --output build/throughput/textured-hit.json
          ./build/throughput-bench.exe --workload sprite-hit --output build/throughput/sprite-hit.json
      - name: Check generated reciprocal seed ROMs
        run: python scripts/generate-reciprocal-rom.py --check
      - name: Verify all demo traversals
        run: |
          for scene in showcase perspective overdraw; do
            ./build/nano-gpu-ref-headless.exe --headless --scene "$scene" --time 1.25 --verify
          done
      - name: Exercise the SDL application
        run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./build/nano-gpu-ref.exe --frames 2 --step 0 --verify
      - name: Verify the Gowin block backend on the original scenes
        run: |
          ./build/nano-gpu-ref-headless.exe --hardware-profile
          for scene in showcase perspective overdraw opaque; do
            ./build/nano-gpu-ref-headless.exe --headless --scene "$scene" --mode blocks --time 1.25 --verify
          done
          SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./build/nano-gpu-ref.exe --scene showcase --mode blocks --frames 2 --step 0 --verify
      - name: Check incremental builds
        # The phony dependency check runs on every ordinary build.
        run: make -q -o check-sdl all headless build/reference-tests.exe build/hardware-tests.exe build/full-hardware-tests.exe build/sdram-tests.exe build/host_link-tests.exe build/scanout-tests.exe build/protocol-tests.exe build/system_copy-tests.exe build/system-tests.exe throughput build/throughput-tests.exe build/perspective-pipeline-tests.exe build/texture-pipeline-tests.exe
      - name: Verify the timed GPU system and actual SDL scanout
        run: |
          ./build/nano-gpu-ref-headless.exe --mode system --hardware-profile
          ./build/nano-gpu-ref-headless.exe --headless --mode system --scene showcase --frames 2 --time 0 --verify
          ./build/nano-gpu-ref-headless.exe --headless --mode system --scene perspective --time 1.25 --host-divider 8 --sdram-trcd 6 --sdram-trp 6 --sdram-trfc 18 --scanout-fifo 256 --verify
          SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software ./build/nano-gpu-ref.exe --mode system --scene showcase --frames 1 --step 0 --verify
      - name: Check steady system throughput and texture residency
        run: make system-benchmark
      - name: Report incomplete full-GPU resource coverage
        run: make resource-report
